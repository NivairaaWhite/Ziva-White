[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zivawhite"
version = "0.4.0"
description = "A from-scratch local assistant: trains on the datasets folder you fill, speaks, listens for wake words, controls your device, runs in the background."
requires-python = ">=3.10"

[project.optional-dependencies]
voice = ["sounddevice>=0.4.6", "vosk>=0.3.45", "pyttsx3>=2.90"]
dev = ["pytest>=8.0", "httpx>=0.27"]
publish = ["huggingface_hub>=0.23", "transformers>=4.44", "datasets>=2.19"]

[project.scripts]
ziva = "zivawhite.app:main"

[tool.setuptools.packages.find]
include = ["zivawhite*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
