[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zivawhite"
version = "0.4.0"
description = "A from-scratch local assistant: trains on the datasets folder you fill, speaks, listens for wake words, controls your device, runs in the background."
requires-python = ">=3.10"
# Keep in step with requirements.txt (tests/test_packaging.py checks that they agree). Upper bounds are the next
# major version (FastAPI, still 0.x, is bounded at 1.0): these libraries ship breaking changes in majors, and an
# unbounded install tomorrow is not the one this code was tested against. For a fully reproducible install, freeze
# a known-good environment: `pip freeze > requirements.lock` (see docs/INSTALL.md).
dependencies = [
  "torch>=2.2,<3",
  "numpy>=1.24,<3",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "tokenizers>=0.19,<1",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0,<7",
  "tqdm>=4.66,<5",
  "psutil>=5.9,<8",
  "python-dotenv>=1.0,<2",
  "pypdf>=4.0,<8",
  "safetensors>=0.4.3,<1",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.4.6,<1", "vosk>=0.3.45,<1", "pyttsx3>=2.90,<3"]
dev = ["pytest>=8.0,<10", "httpx>=0.27"]
# no upper bounds on the Hugging Face tools: they are only used by export/publish, and their majors move quickly
publish = ["huggingface_hub>=0.23", "transformers>=4.44", "datasets>=2.19"]

[project.scripts]
ziva = "zivawhite.app:main"

# Every package is listed so the wheel is complete: `zivawhite.defaults` is the repository's configs/ folder
# (ziva.yaml and the model presets), shipped inside the package so an installed copy has its default settings.
# tests/test_packaging.py fails if a new sub-package is forgotten here.
[tool.setuptools]
packages = [
  "zivawhite",
  "zivawhite.connectors",
  "zivawhite.control",
  "zivawhite.data",
  "zivawhite.defaults",
  "zivawhite.voice",
]

[tool.setuptools.package-dir]
"zivawhite.defaults" = "configs"

[tool.setuptools.package-data]
zivawhite = ["webui/*.html"]
"zivawhite.data" = ["tokenizer/*.json", "tokenizer/*.txt", "tokenizer/*.md"]
"zivawhite.defaults" = ["*.yaml"]

# configs/ziva.local.yaml holds YOUR private overrides (it is git-ignored): never ship it.
[tool.setuptools.exclude-package-data]
"zivawhite.defaults" = ["ziva.local.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
