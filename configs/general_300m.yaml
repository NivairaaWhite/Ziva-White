# General-purpose ~300M model (the "medium" preset), one 40-80GB GPU or a couple of 24GB cards (torchrun).
# python -m zivawhite.app train --config configs/general_300m.yaml --data_dir data/processed --out_dir runs/general-300m
tier: medium
block_size: 2048
batch_size: 8
global_batch_tokens: 524288
max_steps: 40000        # ~21B tokens
max_lr: 3.0e-4
min_lr: 3.0e-5
warmup_steps: 2000
eval_interval: 1000
ckpt_interval: 2000
grad_ckpt: false        # set true if you hit out-of-memory: ~30% slower, far less activation memory
