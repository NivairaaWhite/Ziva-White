# Ziva White -- assistant configuration.
#
# This file is the single place where behaviour is configured: where your
# datasets live, who the assistant says created it, which wake words it answers
# to, what device control is allowed, and what runs in the background.
# Nothing below is hardcoded in the Python code.
#
# Do NOT edit this file to customise your install -- create
# configs/ziva.local.yaml (git-ignored) containing only the keys you want to
# change; it is deep-merged over this file. Point ZIVAWHITE_CONFIG at another
# YAML file to use that one as the override instead.
#
# Relative paths are relative to the project root. "~" is expanded.

identity:
  assistant_name: "Ziva White"
  creator:
    name: "Mahasvin S S"
    alias: "Snow White"
  # What the assistant answers (deterministically, before the language model is
  # consulted) when asked about itself or its creator. Placeholders:
  # {assistant_name} {creator_name} {creator_alias}
  answers:
    creator: "I was created by {creator_name}, also known as {creator_alias}."
    who_are_you: "I'm {assistant_name}, a voice-enabled assistant built from scratch by {creator_name} ({creator_alias})."
    about_creator: "{creator_name}, also known as {creator_alias}, is my creator."
  # The same facts rendered as chat examples that are mixed into conversation fine-tuning (only
  # when you have chat data in the datasets folder), so the model itself learns them too. The
  # deterministic answers above stay in force either way. Add phrasings freely.
  training:
    questions:
      creator:
        - "Who created you?"
        - "Who made you?"
        - "Who built you?"
        - "Who is your creator?"
        - "Who is your developer?"
        - "Who designed you?"
        - "Who programmed you?"
        - "Who is your maker?"
        - "Who do you belong to?"
        - "Tell me who made you."
        - "Who is behind you?"
        - "Who trained you?"
      who_are_you:
        - "Who are you?"
        - "What are you?"
        - "What is your name?"
        - "What's your name?"
        - "Introduce yourself."
        - "Tell me about yourself."
        - "What should I call you?"
      about_creator:
        - "Who is {creator_name}?"
        - "Tell me about {creator_name}."
        - "Who is {creator_alias}?"
        - "Do you know {creator_name}?"

paths:
  datasets: datasets        # <<< PUT YOUR TRAINING DATA HERE: datasets/text/ for prose, datasets/chat/ for conversations.
                            #     Details, formats and examples: datasets/README.md  (also: ZIVAWHITE_DATASETS=<folder> in .env)
  data: data                # generated corpora, shards, dataset state (safe to delete)
  runs: runs                # checkpoints, daemon status/pid/log
  models: models            # speech models (e.g. models/vosk/model)

# -- Learning from the datasets folder ----------------------------------------
autolearn:
  enabled: true
  scan_interval_s: 30       # how often the folder is checked for new/changed files
  settle_s: 5               # ignore files modified in the last N seconds (still being copied)
  base_run: runs/ziva       # the base language model (trained on text)
  chat_run: runs/ziva_behavior   # the conversation-tuned model `ask`/`serve` load first
  initial_text_steps: 1000  # steps for the very first training run, when no model exists yet
  text_train_steps: 200     # extra steps each time the text data changes after that
  chat_train_steps: 100     # steps for each chat fine-tune (kept short on purpose: small chat sets memorise fast)
  chat_lr: 0.0001
  # Overfitting guards (see train.py). 0 disables one. A fixed step count used to mean a small chat set was
  # read dozens of times over; now a run stops at N passes over its data, or when val loss stops improving.
  chat_max_epochs: 3        # most passes over the conversation data in one fine-tune
  chat_patience: 3          # stop after this many evals with no better validation loss
  chat_dropout: 0.1         # regularisation while fine-tuning only (off at inference)
  text_max_epochs: 16       # same cap for base-text training
  text_patience: 5
  min_train_tokens: 8192    # a text corpus smaller than this is not trained on yet (it would only be
                            # memorised); the job reports how much more is needed and keeps waiting
  min_chat_tokens: 2000     # same, for conversation data (chat sets are naturally smaller)
  eval_interval: 100
  ckpt_interval: 100
  max_file_mb: 256          # larger single files are refused with a message (split them)
  max_doc_chars: 1000000    # longer documents are cut at paragraph boundaries
  # Which vocabulary a NEW model starts with. null = the bundled general-English tokenizer (12,000 tokens). It is a
  # starting point, not a fixed setting: every training run saves the tokenizer it used into runs/<run>/tokenizer/, and
  # from then on ask / serve / training find THAT one by themselves. So you never set this for a model that already
  # exists, and changing it later does not alter a trained model (a mismatch stops with a clear message).
  # To train on your own vocabulary instead, run `python -m zivawhite.app tokenizer` (learns one from your datasets
  # folder) BEFORE the first training run and set this to the folder it prints, e.g. data/tokenizer.
  tokenizer_dir: null
  ewc: null                 # optional consolidation.pt from `consolidate`
  train_args: []            # extra flags passed straight to train.py, e.g. ["--tier", "small"]
  throttle:                 # so background training never takes over your machine
    only_when_idle: true
    max_cpu_percent: 70     # wait while overall CPU use is above this
    pause_on_battery: true  # do not train on battery power
    low_priority: true      # run training at below-normal OS priority
  web:                      # optional: also learn from allow-listed web pages (off by default)
    enabled: false
    topics_file: datasets/_sources/topics.txt   # one search topic per line (needs SEARXNG_URL / SEARCH_API_*)
    urls_file: datasets/_sources/urls.txt       # one allow-listed URL per line (works without a search backend)
    topics_per_cycle: 5
    max_chars: 4000
    interval_s: 3600

# -- Voice input / output, wake words -------------------------------------------
voice:
  enabled: false            # background microphone loop. Opt-in: turn on when you want it listening.
  speak_replies: true       # speak answers aloud (local loop; the web UI has its own toggle)
  wake:
    words:                  # any of these wakes the assistant. Add your own.
      - "hey ziva"
      - "ziva"
      - "hey snow white"
      - "snow white"
    sensitivity: 0.88       # 0..1 minimum match score -- lower accepts sloppier matches (more false wakes).
                            # Offline recognisers misspell made-up names; if yours keeps writing "eva" or
                            # "diva" for "ziva", add that spelling to words instead of lowering this.
    ack_phrase: "Yes?"      # spoken after the wake word alone; empty = stay silent
    follow_up_s: 6          # after a reply, keep listening this long without needing the wake word
    listen_timeout_s: 8     # after waking, how long to wait for you to start speaking
  stop_phrases: ["stop", "cancel", "never mind", "be quiet"]
  vad:                      # voice-activity detection (energy based, adapts to room noise)
    silence_ms: 800         # this much quiet ends an utterance
    max_utterance_s: 15
    min_speech_ms: 200
    threshold_factor: 3.0   # speech = energy this many times above the noise floor
  stt:                      # speech-to-text, runs fully offline
    engine: vosk            # vosk | faster_whisper
    model: models/vosk/model        # vosk: folder of an unpacked model. faster_whisper: model name or folder
    language: en
    sample_rate: 16000
    input_device: null      # sounddevice device index or name; null = system default
  tts:                      # text-to-speech
    engine: auto            # auto | system | pyttsx3 | custom
    rate: 175               # words per minute (where the engine supports it)
    voice: null             # engine-specific voice name; null = default
    command: []             # engine "custom": argument list with a {text} placeholder, e.g. ["my-tts", "{text}"]
    timeout_s: 120          # engine "custom": a command still running after this long is killed (it is hung)

# -- Controlling this device ------------------------------------------------------
# Commands are recognised by a fixed grammar (zivawhite/control/intents.py), never from
# language-model output or fetched web text, so a page or a hallucination cannot trigger them.
device_control:
  enabled: true
  allow_power_actions: false      # shutdown / restart are refused unless this is true (and still confirmed)
  confirm_actions: [lock, sleep, restart, shutdown]   # asked "are you sure?" first
  confirm_ttl_s: 20
  volume_step: 10
  brightness_step: 10
  screenshot_dir: "~/Pictures/ZivaWhite"
  # Apps that "open <name>" may launch. Anything not listed is refused.
  # Each entry: per-OS launch target. Add your own.
  apps:
    calculator: {windows: "calc",          macos: "Calculator",      linux: "gnome-calculator"}
    notepad:    {windows: "notepad",       macos: "TextEdit",        linux: "gedit"}
    terminal:   {windows: "wt",            macos: "Terminal",        linux: "gnome-terminal"}
    files:      {windows: "explorer",      macos: "Finder",          linux: "nautilus"}
    settings:   {windows: "ms-settings:",  macos: "System Settings", linux: "gnome-control-center"}
  # Optional smart-home bridge (Home Assistant). Set HOME_ASSISTANT_URL and
  # HOME_ASSISTANT_TOKEN in .env, then map the names you will say to entity ids.
  smart_home:
    enabled: false
    devices: {}             # e.g. {"living room light": "light.living_room"}

# -- Background running -------------------------------------------------------------
background:
  jobs: [autolearn, voice, timers]   # kept going alongside the web server by `run` / `daemon start`
                            # (voice only starts if voice.enabled is true)
  heartbeat_s: 5
  max_restarts: 5           # a crashing job is restarted with backoff, then marked failed
  host: 127.0.0.1
  port: 8000
  status_file: runs/daemon_status.json
  pid_file: runs/daemon.pid
  log_file: runs/daemon.log
  log_max_mb: 5
  log_backups: 3

# How the router decides between answering from the model and fetching the web first.
router:
  confidence_floor: 0.35    # below this mean top-1 probability a local answer falls back to the web (if one is configured)
  loop_threshold: 0.5       # text where this share of 4-word runs repeats is looping, and counts as NOT confident
  freshness_years: null     # [first, last] year that marks a question as "needs current information";
                            # null = last year .. 14 years ahead, which moves with the clock
  freshness_patterns: []    # extra regular expressions that mean the same thing, e.g. ["\\bbreaking\\b"]

# Protection for the HTTP server (separate from the model: nothing here limits what the model can learn or know).
limits:
  max_new_tokens: null      # most tokens one request may ask the model to write; null = one context window (block_size)
  lock_timeout_s: 30        # a request that cannot get the model within this long is answered 503 "busy"
  max_body_bytes: 1000000   # request bodies over this are refused with 413 (env ZIVAWHITE_MAX_BODY_BYTES wins; 0 = off)

# How the local model samples its words (every route: ask, assistant, /v1/chat/completions defaults).
# Leave these out for the original behaviour (temperature 0.8, top_k 50). Small models repeat themselves;
# repetition_penalty ~1.1 with top_p ~0.9 is the usual first fix.
generation:
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  min_p: null
  repetition_penalty: 1.1
